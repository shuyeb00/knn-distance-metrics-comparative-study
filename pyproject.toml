[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "knnmetrics"
version = "2.0.0.dev0"
description = "When does the distance metric matter for k-nearest-neighbour classification?"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "scikit-learn==1.9.1",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "openml==0.15.1",
    "statsmodels==0.15.0",
    "baycomp==1.0.3",
    "scikit-posthocs==0.18.0",
    "threadpoolctl==3.8.0",
    "matplotlib==3.11.2",
    "pyyaml==6.0.4",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]
# torch and faiss are left unpinned so that the CUDA builds preinstalled on Kaggle are not replaced;
# the exact versions used in each run are recorded in the result manifests.
torch = ["torch>=2.4"]
faiss = ["faiss-cpu>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
